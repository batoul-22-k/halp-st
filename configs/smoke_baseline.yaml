experiment_name: smoke_baseline_b0
mode: finetune
dataset:
  name: stsb
  subset: 32
  validation_subset: 16
  test_subset: 16
model:
  variant: baseline
  backbone: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
  pooling: mean
  max_sequence_length: 64
encoder:
  freeze: false
training:
  loss: cosent
  seed: 42
  epochs: 1
  batch_size: 4
  learning_rate: 2.0e-5
  warmup_ratio: 0.1
  weight_decay: 0.01
  gradient_accumulation: 1
  mixed_precision: false

